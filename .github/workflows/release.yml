name: build-windows

# Manual-only trigger. This is a HelperDesk fork, not the upstream
# rustdesk project, so we do not want this to fire on every push /
# pull_request. The upstream `flutter-build.yml` and `flutter-ci.yml`
# already cover PR / push CI; this workflow is purely for cutting
# the renamed Windows artifact on demand.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  # Disable the GitHub Actions cache backend that talks to ACTIONS_CACHE_URL.
  # We do not set it on a self-triggered job, and vcpkg errors out if it
  # cannot reach the cache endpoint.
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build-windows-x64:
    name: helperdesk-windows-x64
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        # The v2 line of this action still targets Node 20, which GitHub
        # runners deprecate on 2025-09-19; v3 is not published. The runner
        # transparently forces Node 24 for legacy actions, so the build still
        # succeeds — this step just emits a deprecation warning in the log.
        # Switch to a different action (e.g. egor-tensin/setup-clang) once
        # upstream releases v3 or stops maintaining the package.
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        # Upstream's Windows build uses a custom engine build (not the stock
        # one from pub.dev). We must precache + swap, or `flutter build
        # windows` will produce a binary that disagrees with the Rust side.
        # The zip's top-level entry is already a `windows-x64-release/`
        # directory, so `Expand-Archive -DestinationPath windows-x64-release`
        # produces a nested layout. Pass `-DestinationPath (Get-Location)`
        # and let the zip's own root land as `./windows-x64-release/`, then
        # move its contents (one level deep) into the Flutter engine cache.
        # All file ops run under $env:RUNNER_TEMP to keep the workspace clean.
        shell: pwsh
        env:
          ENGINE_DIR: ${{ steps.flutter.outputs['CACHE-PATH'] }}\bin\cache\artifacts\engine\windows-x64-release
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'engine-swap'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Path $work | Out-Null
          Push-Location $work

          flutter doctor -v
          flutter precache --windows

          $zip = Join-Path $work 'windows-x64-release.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip' `
            -OutFile $zip
          Expand-Archive -Force -Path $zip -DestinationPath $work

          # The zip expands to <work>/windows-x64-release/<files...>.
          $src = Join-Path $work 'windows-x64-release'
          if (-not (Test-Path $src)) {
            Write-Error "Expected '$src' after Expand-Archive, but it is missing."
            Get-ChildItem $work | Format-Table Name | Out-String | Write-Host
            exit 1
          }
          if (-not (Test-Path $env:ENGINE_DIR)) {
            New-Item -ItemType Directory -Force -Path $env:ENGINE_DIR | Out-Null
          }
          # Mirror contents (files + dirs) into the engine cache. Move-Item
          # requires the destination directory to exist and to be a directory,
          # which the precache step above has already created.
          Get-ChildItem -Force $src | ForEach-Object {
            Move-Item -Force -Path $_.FullName -Destination $env:ENGINE_DIR
          }
          Pop-Location

      - name: Patch flutter (dropdown filter for 3.24.5)
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname $(dirname $(which flutter)))"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          if [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x64-windows-static)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static \
              --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -print0 | while IFS= read -r -d '' f; do
              echo "===== $f ====="
              cat "$f"
              echo "====="
            done
            exit 1
          fi

      - name: Build helperdesk
        shell: bash
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          # build.py leaves the GUI executable and bundled assets under
          # flutter/build/windows/x64/runner/Release/. Rename to a stable
          # path so the upload step and any later tooling can rely on it.
          mv ./flutter/build/windows/x64/runner/Release ./helperdesk
          ls -la ./helperdesk | head -30

      - name: Upload helperdesk-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: helperdesk-windows-x64
          path: helperdesk
          if-no-files-found: error
          retention-days: 14
